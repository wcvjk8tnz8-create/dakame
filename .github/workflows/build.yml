name: Build Check

on:
  push:
    branches: [main]
  pull_request:

env:
  # 关闭匿名遥测（可选，见 https://nextjs.org/telemetry）
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --no-frozen-lockfile

      # 持久化 Next.js 构建缓存，避免每次 CI 都冷启动重建
      # 见 https://nextjs.org/docs/messages/no-cache
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            node_modules/.cache
          key: ${{ runner.os }}-next-${{ hashFiles('**/pnpm-lock.yaml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-next-

      - name: Build
        run: pnpm build
        env:
          # 构建期不需要真实凭证，占位即可（运行时会渲染配置引导）
          AUTH_SECRET: build-placeholder-secret-please-replace-me
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          UPSTASH_REDIS_REST_URL: https://placeholder.upstash.io
          UPSTASH_REDIS_REST_TOKEN: placeholder
          AI_PROVIDER: cloudflare

      - name: Typecheck
        run: pnpm typecheck
